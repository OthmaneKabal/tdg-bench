[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tdg-bench"
version = "2.0.0rc4"
description = "Evaluate text-driven knowledge graphs and GNNs on reproducible benchmark datasets."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Othmane Kabal" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "charset-normalizer>=3.5,<4",
  "huggingface-hub>=0.26,<1",
  "ipywidgets>=8.1,<9",
  "mysql-connector-python>=9",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2",
  "platformdirs>=4",
  "scikit-learn>=1.3",
  "sentence-transformers==5.4.0",
  "transformers==4.46.2",
  "torch==2.5.1",
  "torch-geometric==2.6.1",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/OthmaneKabal/tdg-bench"
Repository = "https://github.com/OthmaneKabal/tdg-bench"
Documentation = "https://github.com/OthmaneKabal/tdg-bench#readme"
Issues = "https://github.com/OthmaneKabal/tdg-bench/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]
notebook = [
  "jupyterlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gnn: tests requiring the optional GNN dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

