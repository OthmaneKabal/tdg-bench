[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tdg-bench"
version = "0.1.0"
description = "Evaluate text-driven knowledge graphs and GNNs on reproducible benchmark datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Othmane Kabal" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "huggingface-hub>=0.26,<2",
  "mysql-connector-python>=9",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2",
  "platformdirs>=4",
  "scikit-learn>=1.3",
  "sentence-transformers>=3",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/OthmaneKabal/tdg-bench"
Repository = "https://github.com/OthmaneKabal/tdg-bench"
Documentation = "https://github.com/OthmaneKabal/tdg-bench#readme"
Issues = "https://github.com/OthmaneKabal/tdg-bench/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]
notebook = [
  "jupyterlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gnn: tests requiring the optional GNN dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py310"

